name : workflow

on:
    push:
        branches: 
            - main
        paths-ignore:
            - 'README.md'   

jobs:
    integeration:
        name: Continuous Integration
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Lint code
              run: echo "Linting code..."
            
            - name: Run unit tests
              run: echo "Running unti tests..."

    build-and-push-ecr-image:
        name: Continuous Delivery
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Install utilities
              run: |
                sudo apt-get update
                sudo apt-get install -y jq unzip
            
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v2
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ secrets.AWS_REGION }}
            
            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v1

            - name: Build, tag, and push image to Amazon ECR
              id: build-image
              env:
                ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
                IMAGE_TAG: latest
              run: |
                echo "Building Docker image..."
                docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
                echo "Pushing Docker image to Amazon ECR..."
                docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
                echo "Docker image pushed to Amazon ECR: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

    Continuous-Deployment:
        name: Continuous Deployment
        runs-on: self-hosted
        needs: build-and-push-ecr-image
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
            
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v2
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ secrets.AWS_REGION }}

            - name: Log in to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v1

            - name: pull the latest image
              run: |
                docker pull ${{ secrets.AWS_ECR_LOGIN_URI }}/${{ secrets.ECR_REPOSITORY_NAME }}:latest
             
            - name: Stop and remove old container
              run: |
                docker stop networksecurity || true
                docker rm networksecurity || true

            - name: Run docker container
              run: |
                docker run -d \
                --name networksecurity \
                --restart unless-stopped \
                --ipc=host \
                -p 80:8000 \
                -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
                -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
                -e AWS_DEFAULT_REGION=${{ secrets.AWS_REGION }} \
                -e SCHEMA_FILE_PATH=data_schema/schema.yaml \
                -e MODEL_FILE_PATH=saved_models/model.pkl \
                ${{ secrets.AWS_ECR_LOGIN_URI }}/${{ secrets.ECR_REPOSITORY_NAME }}:latest                     
            - name: clean previous docker images
              run: |
                docker image prune -f 